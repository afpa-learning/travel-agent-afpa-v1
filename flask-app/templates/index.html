<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Assistant</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
		<div class="brand-afpa">
			<img src="{{ url_for('static', filename='img/layout_set_logo.jpg') }}" width="30px">
		</div>
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l18-8-8 18-2-8-8-2z"/></svg>
      </div>
      <div>
        <h1>Travel Assistant</h1>
        <div class="brand-sub">recherche - vols - prix</div>
      </div>
    </div>
    <div class="status-row">
      <span class="pill error" id="connectedMcp"><span class="dot"></span>MCP: déconnecté</span>
      <span class="pill error" id="connectedLLM"><span class="dot"></span>LLM: inactif</span>
      <label class="theme-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span class="switch">
          <input type="checkbox" id="themeSwitch">
          <span class="slider"></span>
        </span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </label>
    </div>
  </div>

  <div class="layout">
    <div class="chat-col">
      <div class="chat-scroll" id="chatScroll"></div>

      <div class="composer">
        <input type="text" id="chatInput" placeholder="Posez votre question en langage clair — ex. Trouves-moi un vol Paris → Bangkok" autocomplete="off">
        <button id="sendBtn">Envoyer</button>
      </div>
    </div>

    <div class="sidebar">
      
      <div class="sidebar-section">
        <button class="newconversation" id="newConversation">Nouvelle conversation</button>
      </div>
      
      <div class="sidebar-section">
        <h2>Essayez ceci</h2>
        <button class="suggestion" data-q="search-paris-tokyo">Trouves-moi un vol Paris → Tokyo fin novembre, budget max 700 €</button>
        <button class="suggestion" data-q="search-lisbonne">Quels sont les vols directs vers Lisbonne en octobre ?</button>
        <button class="suggestion" data-q="compare-flights">Compare les vols AF1180 et EK071</button>
        <button class="suggestion" data-q="search-bangkok">Quel est le vol le moins cher pour Bangkok en décembre ?</button>
        <button class="suggestion" data-q="count-places">Combien de places restent sur le vol AF1180 du 10 décembre ?</button>
      </div>

      <div class="sidebar-section">
        <h2>Outils MCP</h2>
        <div class="tools-list" id="toolsList"></div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
