services:
  mongodb:
    image: mongo:7
    container_name: travel-agent-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-Test1234}
      MONGO_INITDB_DATABASE: travel_agent_db
    volumes:
      - travel-agent-mongo-data:/data/db

volumes:
  travel-agent-mongo-data:
